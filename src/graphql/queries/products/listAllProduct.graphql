query ListAllProducts($input: ListAllProductsInput!) {
  listAllProducts(input: $input) {
    edges {
      cursor
      node {
        id
        name
        code
        price
        createdAt
        updatedAt
        priceWithVAT
        priceWithoutVAT
        weight
        createdAt
        updatedAt
        height
        type
        width
        available
        category{
          id
          name
        }
        unit
        formType
        description
        shipment {
          id
          receivedDate
          supplierName
          inventory {
            id
            quantity
          }
          shimentCode
        }
      }
    }
    pageInfo{
      hasNextPage
      endCursor
    }
    totalCount
  }
}